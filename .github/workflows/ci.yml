# CI déléguée au reusable workflow famille (dev-pwa-config).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  ci:
    uses: mister-guiiug/dev-pwa-config/.github/workflows/pwa-ci.yml@v6
    # PAS de `secrets: inherit` : ce workflow n'en déclare aucun, et
    # `GITHUB_TOKEN` lui est fourni d'office. Hériter enverrait TOUS les
    # secrets du dépôt à un workflow qui n'en demande pas un seul.
    with:
      run-doctor: true # la checklist du parc, lue sur le dépôt et sur dist/ (AMELIORATIONS.md, T2)
      # `doctor-strict` reste à `false`, et voici pourquoi. Relevé du 19/09/2026 :
      # le docteur rend « 0 défaut(s) » ici, mais pas « 0 dette(s) » — et
      # `--strict` échoue sur une dette (pwa-doctor.mjs:1631). Ce qui bloque,
      # cette PR appliquée :
      #   · déploiement Pages écrit à la main : ni repli SPA 404.html, ni required-env, ni base path
      #   · VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY en secret alors que Vite les copie dans le bundle
      # Le mode strict s'active quand cette liste est vide. Pas avant : une CI
      # rouge sur une dette connue et non traitée n'apprend rien à personne.
      # Les seuils de `vitest.config.ts` ne sont VÉRIFIÉS que si la CI
      # joue `--coverage` : sans cette entrée Vitest ne mesure rien,
      # donc ne compare rien, et le job sort vert. Relevé du 13/09/2026 :
      # six dépôts déclaraient des seuils, UN SEUL les jouait.
      run-coverage: true
      # La suite existait et ne tournait nulle part : le docteur le disait en
      # dette (« les e2e ne tournent pas en CI »), et rien ne peut échouer sur
      # une dette. Mesuré le 19/09/2026 avec la commande exacte du
      # réutilisable : 9 tests, 11 s, tous verts.
      #
      # `.*` et non le défaut du socle : sous `@critical|@a11y`, TROIS fichiers
      # sur cinq restent entièrement dehors (feedback, home, stats) et le job
      # sortirait vert sans les avoir joués — 2 tests au lieu de 9. Ce que le
      # filtre ferait gagner : quelques secondes. Un filtre qui coûte de la
      # couverture et ne rend rien, on ne le garde pas (cf. miss-badminton).
      run-e2e: true
      e2e-grep: '.*'
      # Des VITE_* FACTICES — jamais les vraies clés, qui ne servent à rien ici.
      # Sans elles, `import.meta.env.VITE_SUPABASE_URL` vaut `undefined` au
      # build : le repli `cached = null` de `getSupabase()` devient
      # inconditionnel, le `await import('@supabase/supabase-js')` inatteignable,
      # et Rolldown élimine le SDK EN ENTIER. La CI mesurait alors un bundle
      # amputé de 49,7 kB gzip — un cinquième du total — et déclarait le budget
      # tenu pendant que le build de `deploy.yml`, qui reçoit les secrets,
      # dépassait la borne de 35 kB.
      # Leur seul rôle est d'être NON VIDES : la forme suffit à garder le SDK
      # dans le graphe, la valeur n'est jamais appelée (aucun test ne réseaute).
      build-env: |
        VITE_SUPABASE_URL=https://ci-factice.supabase.co
        VITE_SUPABASE_ANON_KEY=ci-factice
      # Second avis TypeScript 7, NON BLOQUANT. La 6 reste la référence : c'est
      # elle que typescript-eslint résout, et il refuse la 7.0 par une assertion
      # à l'import. Le jour où typescript-eslint#10940 se ferme, cette entrée
      # et l'alias `typescript-7` disparaissent ensemble.
      run-type-check-7: true
