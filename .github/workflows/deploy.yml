# Déploiement GitHub Pages délégué au reusable workflow famille (dev-wpa-config).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  packages: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    uses: mister-guiiug/dev-wpa-config/.github/workflows/pwa-deploy.yml@v3
    secrets: inherit
    with:
      use-base-path: true
      # Secrets Supabase OPTIONNELS (fonction « live » multi-appareils) : l'app
      # build et tourne sans — l'UI live est alors simplement masquée. Absents,
      # ces lignes injectent une valeur vide (comportement inchangé).
      build-env: |
        VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
        VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
