<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- La Content-Security-Policy est injectée au build par cspPlugin()
         (@mister-guiiug/dev-wpa-config/vite-csp) : script-src par hash SHA-256
         de l'IIFE anti-FOUC ci-dessous, plus de 'unsafe-inline'. -->
    <script>
      (function () {
        try {
          var k = 'mm_theme';
          var v = localStorage.getItem(k);
          var eff;
          if (v === 'light' || v === 'dark') eff = v;
          else
            eff = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          document.documentElement.setAttribute('data-theme', eff);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <link rel="icon" type="image/png" sizes="64x64" href="icons/favicon.png" />
