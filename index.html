<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- La Content-Security-Policy est injectée au build par cspPlugin()
         (@mister-guiiug/dev-pwa-config/vite-csp) : script-src par hash SHA-256
         du script anti-FOUC inline, plus de 'unsafe-inline'. -->
    <!-- Le script anti-FOUC est injecté en tête de <head> par pwaSeoPlugin()
         (option themeBoot, @mister-guiiug/dev-pwa-config/theme-boot) : clé
         dwc_theme, migration depuis l'ancienne clé mm_theme. Il remplace
         l'IIFE qui vivait ici. -->
    <link rel="icon" type="image/png" sizes="64x64" href="icons/favicon.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="icons/icon-192.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="icons/icon-512.png"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <!-- <meta name="theme-color"> : deux balises par schéma (attribut media)
         injectées par pwaSeoPlugin() via l'option themeColor. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Mister Mölkky" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="icons/apple-touch-icon.png"
    />
    <meta
      name="description"
      content="Compteur de points et statistiques pour le jeu de Mölkky : 100 % offline, animations Rive, historique des parties."
    />
    <link rel="canonical" href="__SEO_HOME_URL__" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mister Mölkky" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:url" content="__SEO_HOME_URL__" />
    <meta
      property="og:title"
      content="Mister Mölkky — compteur de points et statistiques"
    />
    <meta
      property="og:description"
      content="Compteur de points et statistiques pour le jeu de Mölkky : 100 % offline, animations Rive, historique des parties."
    />
    <meta property="og:image" content="__SEO_LOGO_URL__" />

    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="Mister Mölkky — compteur de points et statistiques"
    />
    <meta
      name="twitter:description"
      content="Compteur de points et statistiques pour le jeu de Mölkky, 100 % offline et installable (PWA)."
    />
    <meta name="twitter:image" content="__SEO_LOGO_URL__" />

    <!-- Analytics (GTM/GA4) injecté par pwaSeoPlugin() — vide tant qu'aucun
         VITE_GTM_CONTAINER_ID / VITE_GA_MEASUREMENT_ID n'est configuré. -->
    __ANALYTICS_HEAD__
    <title>Mister Mölkky</title>
  </head>
  <body>
    __ANALYTICS_BODY__
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
